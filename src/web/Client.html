<script>
(function() {
  var bootstrap = window.__A3_BOOTSTRAP__ || {};

  var DEFAULT_LABELS = Object.freeze({
    userName: 'You',
    partnerName: 'Partner'
  });

  var RETRYABLE_CODES = {
    GEMINI_RATE_LIMIT: true,
    GEMINI_BAD_RESPONSE: true,
    GEMINI_TEMPORARY_FAILURE: true,
    STORAGE_WRITE_FAILED: true,
    MAIL_QUOTA_EXHAUSTED: true,
    QUEUE_LOCK_BUSY: true
  };

  var POLL_DELAYS_SECONDS = [
    3,
    5,
    8,
    13,
    21,
    34,
    55,
    89,
    120,
    120,
    120
  ];

  var state = {
    messages: [],
    pagination: {
      hasMore: false,
      nextBeforeMessageId: null
    },
    system: normalizeSystemConfig(null),
    loadingOlder: false,
    sending: false,
    selectedImage: null,
    activeRequestId: null,
    pollTimer: null,
    backgroundPollTimer: null,
    backgroundPollInFlight: false,
    backgroundPollToken: 0,
    backgroundPollingEnabled: false,
    settings: null,
    savingSettings: false,
    diary: {
      entries: [],
      pagination: {
        hasMore: false,
        nextBeforeDate: null
      },
      selectedDate: null,
      loaded: false,
      loading: false
    }
  };

  var elements = {};

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    cacheElements();
    bindEvents();
    elements.messageInput.maxLength = String(bootstrap.maxUserTextChars || 4000);
    renderAttachmentMeta();
    setStatus('loading', '読み込み中', 'チャット画面を準備しています。');
    loadInitialState();
  }

  function cacheElements() {
    elements.partnerTitle = document.getElementById('partner-title');
    elements.statusPanel = document.getElementById('status-panel');
    elements.statusLabel = document.getElementById('status-label');
    elements.statusText = document.getElementById('status-text');
    elements.messages = document.getElementById('messages');
    elements.historyNote = document.getElementById('history-note');
    elements.loadOlderButton = document.getElementById('load-older-button');
    elements.refreshButton = document.getElementById('refresh-button');
    elements.aboutButton = document.getElementById('about-button');
    elements.aboutCloseButton = document.getElementById('about-close-button');
    elements.aboutPanel = document.getElementById('about-panel');
    elements.aboutMessage = document.getElementById('about-message');
    elements.aboutBoundary = document.getElementById('about-boundary');
    elements.diaryButton = document.getElementById('diary-button');
    elements.diaryCloseButton = document.getElementById('diary-close-button');
    elements.diaryRefreshButton = document.getElementById('diary-refresh-button');
    elements.diaryPanel = document.getElementById('diary-panel');
    elements.diaryStatus = document.getElementById('diary-status');
    elements.diaryLayout = document.getElementById('diary-layout');
    elements.diaryList = document.getElementById('diary-list');
    elements.diaryMoreButton = document.getElementById('diary-more-button');
    elements.diaryEntry = document.getElementById('diary-entry');
    elements.diaryEntryDate = document.getElementById('diary-entry-date');
    elements.diaryEntryTitle = document.getElementById('diary-entry-title');
    elements.diaryEntryBody = document.getElementById('diary-entry-body');
    elements.settingsButton = document.getElementById('settings-button');
    elements.settingsCloseButton = document.getElementById('settings-close-button');
    elements.settingsPanel = document.getElementById('settings-panel');
    elements.settingsForm = document.getElementById('settings-form');
    elements.settingsRuntime = document.getElementById('settings-runtime');
    elements.settingsResult = document.getElementById('settings-result');
    elements.settingsSaveButton = document.getElementById('settings-save-button');
    elements.onboardingCallout = document.getElementById('onboarding-callout');
    elements.partnerNameInput = document.getElementById('partner-name-input');
    elements.userAddressInput = document.getElementById('user-address-input');
    elements.replyLengthInput = document.getElementById('reply-length-input');
    elements.proactiveFrequencyInput = document.getElementById('proactive-frequency-input');
    elements.quietStartInput = document.getElementById('quiet-start-input');
    elements.quietEndInput = document.getElementById('quiet-end-input');
    elements.composerForm = document.getElementById('composer-form');
    elements.messageInput = document.getElementById('message-input');
    elements.imageInput = document.getElementById('image-input');
    elements.attachmentMeta = document.getElementById('attachment-meta');
    elements.previewCard = document.getElementById('preview-card');
    elements.previewImage = document.getElementById('preview-image');
    elements.previewName = document.getElementById('preview-name');
    elements.previewSize = document.getElementById('preview-size');
    elements.removeImageButton = document.getElementById('remove-image-button');
    elements.helperText = document.getElementById('helper-text');
    elements.sendButton = document.getElementById('send-button');
  }

  function bindEvents() {
    elements.composerForm.addEventListener('submit', onSubmit);
    elements.imageInput.addEventListener('change', onImageSelected);
    elements.removeImageButton.addEventListener('click', clearSelectedImage);
    elements.loadOlderButton.addEventListener('click', onLoadOlder);
    elements.refreshButton.addEventListener('click', loadInitialState);
    elements.aboutButton.addEventListener('click', function() {
      togglePanel(elements.diaryPanel, elements.diaryButton, false);
      togglePanel(elements.settingsPanel, elements.settingsButton, false);
      togglePanel(elements.aboutPanel, elements.aboutButton, true);
    });
    elements.aboutCloseButton.addEventListener('click', function() {
      togglePanel(elements.aboutPanel, elements.aboutButton, false);
    });
    elements.settingsButton.addEventListener('click', function() {
      togglePanel(elements.aboutPanel, elements.aboutButton, false);
      togglePanel(elements.diaryPanel, elements.diaryButton, false);
      togglePanel(elements.settingsPanel, elements.settingsButton, true);
    });
    elements.settingsCloseButton.addEventListener('click', function() {
      togglePanel(elements.settingsPanel, elements.settingsButton, false);
    });
    elements.diaryButton.addEventListener('click', onDiaryOpen);
    elements.diaryCloseButton.addEventListener('click', function() {
      togglePanel(elements.diaryPanel, elements.diaryButton, false);
    });
    elements.diaryRefreshButton.addEventListener('click', function() {
      loadDiaryPage(true);
    });
    elements.diaryMoreButton.addEventListener('click', function() {
      loadDiaryPage(false);
    });
    elements.settingsForm.addEventListener('submit', onSettingsSubmit);
    elements.messageInput.addEventListener('input', autoResizeTextarea);
    document.addEventListener(
      'visibilitychange',
      onVisibilityChange
    );
  }

  function loadInitialState() {
    clearPoll();
    resetBackgroundPolling();
    setBusyState(false);
    setStatus('loading', '更新中', '最新の会話を確認しています。');

    callServer('getInitialState', [])
      .then(function(response) {
        var system = response.system || {};

        state.system = normalizeSystemConfig(system);
        state.backgroundPollingEnabled =
          system.status !== 'stopped';
        state.messages = Array.isArray(response.messages) ? response.messages.slice() : [];
        state.pagination = response.pagination || {
          hasMore: false,
          nextBeforeMessageId: null
        };
        state.settings = response.settings || null;

        renderSystem(system);
        renderProductDisclosure(response.productDisclosure || {});
        renderSettings(state.settings);
        renderMessages('bottom');
        updatePaginationUi();

        if (state.settings && state.settings.onboardingRequired) {
          togglePanel(elements.settingsPanel, elements.settingsButton, true);
        }

        if (system.status === 'stopped') {
          setStatus('not-configured', '設定が必要です', joinWarnings(system.warnings, 'アプリの設定が完了していません。'));
          setComposerEnabled(false);
          return;
        }

        setComposerEnabled(true);
        scheduleBackgroundPoll();

        if (system.status === 'degraded') {
          setStatus('succeeded', 'キューモード', joinWarnings(system.warnings, 'メッセージは送信できますが、返信生成は制限されています。'));
        } else {
          setStatus('succeeded', '準備完了', '最新の会話を表示しました。');
        }
      })
      .catch(function(error) {
        setStatus('retryable-failure', '読み込み失敗', error.message || 'チャット画面を読み込めませんでした。');
      });
  }

  function onLoadOlder() {
    if (!state.pagination.hasMore || state.loadingOlder) {
      return;
    }

    state.loadingOlder = true;
    updatePaginationUi();
    setStatus('loading', '履歴読み込み中', '過去の会話を取得しています。');

    callServer('loadMessages', [state.pagination.nextBeforeMessageId, bootstrap.pageSize || 20])
      .then(function(response) {
        var olderMessages = Array.isArray(response.messages) ? response.messages : [];

        state.messages = olderMessages.concat(state.messages);
        state.pagination = response.pagination || state.pagination;

        renderMessages('preserve');
        updatePaginationUi();

        setStatus(
          'succeeded',
          '履歴を更新しました',
          olderMessages.length > 0 ? '過去の会話を読み込みました。' : '追加の会話は見つかりませんでした。'
        );
      })
      .catch(function(error) {
        setStatus('retryable-failure', '履歴読み込み失敗', error.message || '過去の会話を読み込めませんでした。');
      })
      .finally(function() {
        state.loadingOlder = false;
        updatePaginationUi();
      });
  }

  function onSubmit(event) {
    event.preventDefault();

    if (state.sending) {
      return;
    }

    var text = elements.messageInput.value || '';

    if (!text.trim() && !state.selectedImage) {
      setStatus('failed', '送信内容がありません', 'メッセージを入力するか画像を添付してください。');
      return;
    }

    var requestId = generateRequestId();
    var request = {
      requestId: requestId,
      text: text,
      clientTimestamp: toOffsetIsoString(new Date()),
      image: state.selectedImage ? {
        name: state.selectedImage.name,
        mimeType: state.selectedImage.mimeType,
        base64: state.selectedImage.base64
      } : null
    };

    state.sending = true;
    state.activeRequestId = requestId;

    setBusyState(true);
    setStatus('sending', '送信中', 'メッセージを送信しています。');

    callServer('sendChat', [request])
      .then(function(result) {
        if (result && result.ok && result.userMessage) {
          upsertMessage(result.userMessage);
          renderMessages('bottom');
        }

        if (result && result.ok) {
          elements.messageInput.value = '';
          autoResizeTextarea();
          clearSelectedImage();
        }

        handleChatResult(result, true);

        if (result && result.status === 'queued') {
          schedulePoll(requestId, 0);
        }
      })
      .catch(function(error) {
        setStatus('retryable-failure', '送信失敗', error.message || 'メッセージを送信できませんでした。');
      })
      .finally(function() {
        state.sending = false;
        setBusyState(false);
      });
  }

  function handleChatResult(result, fromSend) {
    if (!result) {
      setStatus('failed', '不正な応答', 'サーバーから空の応答が返りました。');
      return;
    }

    if (result.status === 'completed' && result.assistantMessage) {
      upsertMessage(result.userMessage);
      upsertMessage(result.assistantMessage);
      renderMessages('bottom');

      setStatus('succeeded', '返信を受信しました', '返信が表示されました。');
      clearPoll();
      return;
    }

    if (result.status === 'queued') {
      var queuedText = joinWarnings(
        result.warnings,
        fromSend
          ? 'メッセージを受け付けました。返信を生成しています。'
          : '返信はまだ生成中です。引き続き確認しています。'
      );

      setStatus(fromSend ? 'sending' : 'loading', fromSend ? '送信済み' : '返信確認中', queuedText);
      return;
    }

    if (result.status === 'routed' && result.notice) {
      setStatus(
        'succeeded',
        result.notice.title || 'アプリからのお知らせ',
        result.notice.message || ''
      );
      clearPoll();
      return;
    }

    if (result.status === 'failed') {
      var retryable = isRetryableFailure(result.error);

      setStatus(
        retryable ? 'retryable-failure' : 'failed',
        retryable ? '再試行可能な失敗' : '処理失敗',
        result.error && result.error.message ? result.error.message : 'リクエストの処理に失敗しました。'
      );
    }
  }

  function schedulePoll(requestId, attemptIndex) {
    clearPoll();

    if (requestId !== state.activeRequestId) {
      return;
    }

    if (attemptIndex >= POLL_DELAYS_SECONDS.length) {
      setStatus('succeeded', '返信待ち', '返信はまだ生成中です。Refreshで最新状態を確認できます。');
      return;
    }

    var delaySeconds = POLL_DELAYS_SECONDS[attemptIndex];
    var delayed = attemptIndex >= 4;

    setStatus(
      'loading',
      delayed ? '返信確認中' : '返信生成中',
      delayed
        ? '返信が遅れているため、間隔を空けて確認を続けています。'
        : 'メッセージは送信済みです。返信を生成しています。'
    );

    state.pollTimer = window.setTimeout(function() {
      callServer('getRequestStatus', [requestId])
        .then(function(result) {
          handleChatResult(result, false);

          if (
            result &&
            (result.status === 'completed' || result.status === 'routed')
          ) {
            return;
          }

          if (result && result.status === 'failed') {
            clearPoll();
            return;
          }

          schedulePoll(requestId, attemptIndex + 1);
        })
        .catch(function(error) {
          setStatus('retryable-failure', '状態確認失敗', error.message || '返信状態を確認できませんでした。Refreshで再確認できます。');
          schedulePoll(requestId, attemptIndex + 1);
        });
    }, delaySeconds * 1000);
  }

  function clearPoll() {
    if (state.pollTimer) {
      window.clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
  }

  function resetBackgroundPolling() {
    state.backgroundPollToken += 1;
    state.backgroundPollingEnabled = false;
    state.backgroundPollInFlight = false;
    clearBackgroundPoll();
  }

  function clearBackgroundPoll() {
    if (state.backgroundPollTimer) {
      window.clearTimeout(state.backgroundPollTimer);
      state.backgroundPollTimer = null;
    }
  }

  function scheduleBackgroundPoll(delaySeconds) {
    clearBackgroundPoll();

    if (
      !state.backgroundPollingEnabled ||
      document.hidden
    ) {
      return;
    }

    var token = state.backgroundPollToken;
    var configuredDelay = Number(
      bootstrap.proactiveWebPollSeconds || 60
    );
    var delay = delaySeconds == null
      ? configuredDelay
      : Number(delaySeconds);

    if (!isFinite(delay) || delay < 0) {
      delay = configuredDelay;
    }

    state.backgroundPollTimer = window.setTimeout(
      function() {
        runBackgroundPoll(token);
      },
      delay * 1000
    );
  }

  function runBackgroundPoll(token) {
    if (
      token !== state.backgroundPollToken ||
      !state.backgroundPollingEnabled ||
      document.hidden ||
      state.backgroundPollInFlight
    ) {
      return;
    }

    state.backgroundPollInFlight = true;
    var nextDelay = Number(
      bootstrap.proactiveWebPollSeconds || 60
    );

    callServer('loadNewMessages', [
      getLatestMessageId(),
      bootstrap.pageSize || 20
    ])
      .then(function(response) {
        if (token !== state.backgroundPollToken) {
          return;
        }

        var messages = Array.isArray(response.messages)
          ? response.messages
          : [];
        var changed = false;

        messages.forEach(function(message) {
          changed = upsertMessage(message) || changed;
        });

        if (changed) {
          renderMessages('new');
        }

        if (response.hasMore) {
          nextDelay = 1;
        }
      })
      .catch(function() {
        nextDelay = Number(
          bootstrap.proactiveWebPollSeconds || 60
        );
      })
      .finally(function() {
        if (token !== state.backgroundPollToken) {
          return;
        }
        state.backgroundPollInFlight = false;
        scheduleBackgroundPoll(nextDelay);
      });
  }

  function getLatestMessageId() {
    if (!state.messages.length) {
      return null;
    }
    return state.messages[state.messages.length - 1].messageId || null;
  }

  function onVisibilityChange() {
    if (document.hidden) {
      clearBackgroundPoll();
      return;
    }

    if (state.backgroundPollingEnabled) {
      scheduleBackgroundPoll(0);
    }
  }

  function onImageSelected(event) {
    var file = event.target.files && event.target.files[0];

    if (!file) {
      clearSelectedImage();
      return;
    }

    var allowedMimeTypes = bootstrap.allowedMimeTypes || ['image/jpeg', 'image/png', 'image/webp'];
    var maxBytes = bootstrap.imageMaxBytes || 4194304;

    if (allowedMimeTypes.indexOf(file.type) === -1) {
      clearSelectedImage();
      setStatus('failed', '未対応の画像形式', 'JPEG、PNG、WebP画像を選択してください。');
      return;
    }

    if (file.size > maxBytes) {
      clearSelectedImage();
      setStatus('failed', '画像が大きすぎます', '画像サイズは ' + formatBytes(maxBytes) + ' 以下にしてください。');
      return;
    }

    readFileAsDataUrl(file)
      .then(function(dataUrl) {
        state.selectedImage = {
          name: file.name,
          size: file.size,
          mimeType: file.type,
          base64: dataUrl.split(',')[1] || '',
          previewUrl: dataUrl
        };

        renderPreview();
        setStatus('succeeded', '画像を添付しました', file.name + ' を添付しました。');
      })
      .catch(function(error) {
        clearSelectedImage();
        setStatus('failed', '画像読み込み失敗', error.message || '画像を読み込めませんでした。');
      });
  }

  function clearSelectedImage() {
    state.selectedImage = null;
    elements.imageInput.value = '';
    renderPreview();
  }

  function renderPreview() {
    if (!state.selectedImage) {
      elements.previewCard.classList.add('hidden');
      elements.previewImage.removeAttribute('src');
      elements.previewName.textContent = '';
      elements.previewSize.textContent = '';
      return;
    }

    elements.previewCard.classList.remove('hidden');
    elements.previewImage.src = state.selectedImage.previewUrl;
    elements.previewName.textContent = state.selectedImage.name;
    elements.previewSize.textContent = formatBytes(state.selectedImage.size);
  }

  function renderSystem(system) {
    state.system = normalizeSystemConfig(system);
    elements.partnerTitle.textContent = state.system.partnerName;
    elements.historyNote.textContent = state.system.userName
      ? state.system.userName + ' としてチャット中'
      : '最新の会話';
  }

  function renderProductDisclosure(disclosure) {
    elements.aboutMessage.textContent = disclosure.message || '';
    elements.aboutBoundary.textContent = disclosure.boundary || '';
  }

  function onDiaryOpen() {
    togglePanel(elements.aboutPanel, elements.aboutButton, false);
    togglePanel(elements.settingsPanel, elements.settingsButton, false);
    togglePanel(elements.diaryPanel, elements.diaryButton, true);
    if (!state.diary.loaded && !state.diary.loading) {
      loadDiaryPage(true);
    }
  }

  function loadDiaryPage(reset) {
    if (state.diary.loading) {
      return;
    }
    if (!reset && !state.diary.pagination.hasMore) {
      return;
    }

    var beforeDate = reset
      ? null
      : state.diary.pagination.nextBeforeDate;
    state.diary.loading = true;
    elements.diaryRefreshButton.disabled = true;
    elements.diaryMoreButton.disabled = true;
    elements.diaryStatus.removeAttribute('data-state');
    elements.diaryStatus.textContent = reset
      ? '日記を読み込んでいます…'
      : '以前の日記を読み込んでいます…';

    callServer('loadDiaryEntries', [beforeDate, 12])
      .then(function(response) {
        if (!response || !response.ok) {
          var message = response && response.error && response.error.message
            ? response.error.message
            : '日記を読み込めませんでした。';
          throw new Error(message);
        }

        var incoming = Array.isArray(response.entries)
          ? response.entries
          : [];
        state.diary.entries = reset
          ? incoming.slice()
          : appendUniqueDiaryEntries_(state.diary.entries, incoming);
        state.diary.pagination = response.pagination || {
          hasMore: false,
          nextBeforeDate: null
        };
        state.diary.loaded = true;

        if (
          reset ||
          !state.diary.selectedDate ||
          !findDiaryEntry_(state.diary.selectedDate)
        ) {
          state.diary.selectedDate = state.diary.entries.length > 0
            ? state.diary.entries[0].date
            : null;
        }

        renderDiaryArchive_();
        var warnings = Array.isArray(response.warnings)
          ? response.warnings.filter(Boolean)
          : [];
        if (state.diary.entries.length === 0) {
          elements.diaryStatus.textContent =
            'まだ読める日記はありません。日記が生成されると、ここに表示されます。';
        } else if (warnings.length > 0) {
          elements.diaryStatus.textContent = warnings.join(' ');
        } else {
          elements.diaryStatus.textContent = '日記を読み込みました。';
        }
      })
      .catch(function(error) {
        elements.diaryStatus.setAttribute('data-state', 'error');
        elements.diaryStatus.textContent =
          error.message || '日記を読み込めませんでした。';
      })
      .finally(function() {
        state.diary.loading = false;
        elements.diaryRefreshButton.disabled = false;
        elements.diaryMoreButton.disabled = false;
        updateDiaryPaginationUi_();
      });
  }

  function appendUniqueDiaryEntries_(existing, incoming) {
    var seen = {};
    var combined = [];
    (existing || []).concat(incoming || []).forEach(function(entry) {
      if (!entry || !entry.date || seen[entry.date]) {
        return;
      }
      seen[entry.date] = true;
      combined.push(entry);
    });
    return combined;
  }

  function renderDiaryArchive_() {
    while (elements.diaryList.firstChild) {
      elements.diaryList.removeChild(elements.diaryList.firstChild);
    }

    if (state.diary.entries.length === 0) {
      elements.diaryLayout.classList.toggle(
        'hidden',
        !state.diary.pagination.hasMore
      );
      elements.diaryEntry.classList.add('hidden');
      clearDiaryEntry_();
      updateDiaryPaginationUi_();
      return;
    }

    elements.diaryLayout.classList.remove('hidden');
    elements.diaryEntry.classList.remove('hidden');
    state.diary.entries.forEach(function(entry) {
      var button = document.createElement('button');
      button.className = 'diary-list-button';
      button.type = 'button';
      button.setAttribute(
        'aria-current',
        entry.date === state.diary.selectedDate ? 'true' : 'false'
      );

      var date = document.createElement('span');
      date.className = 'diary-list-date';
      date.textContent = formatDiaryDate_(entry.date);

      var title = document.createElement('span');
      title.className = 'diary-list-title';
      title.textContent = entry.title || '題名のない日記';

      button.appendChild(date);
      button.appendChild(title);
      button.addEventListener('click', function() {
        state.diary.selectedDate = entry.date;
        renderDiaryArchive_();
      });
      elements.diaryList.appendChild(button);
    });

    renderSelectedDiaryEntry_();
    updateDiaryPaginationUi_();
  }

  function renderSelectedDiaryEntry_() {
    var entry = findDiaryEntry_(state.diary.selectedDate);
    if (!entry) {
      clearDiaryEntry_();
      return;
    }
    elements.diaryEntryDate.dateTime = entry.date;
    elements.diaryEntryDate.textContent = formatDiaryDate_(entry.date);
    elements.diaryEntryTitle.textContent = entry.title || '題名のない日記';
    elements.diaryEntryBody.textContent = entry.narrative || '';
  }

  function clearDiaryEntry_() {
    elements.diaryEntryDate.removeAttribute('datetime');
    elements.diaryEntryDate.textContent = '';
    elements.diaryEntryTitle.textContent = '';
    elements.diaryEntryBody.textContent = '';
  }

  function findDiaryEntry_(date) {
    for (var i = 0; i < state.diary.entries.length; i += 1) {
      if (state.diary.entries[i].date === date) {
        return state.diary.entries[i];
      }
    }
    return null;
  }

  function updateDiaryPaginationUi_() {
    elements.diaryMoreButton.classList.toggle(
      'hidden',
      !state.diary.pagination.hasMore
    );
    elements.diaryMoreButton.textContent = state.diary.loading
      ? '読み込み中…'
      : '以前の日記を読む';
  }

  function formatDiaryDate_(dateString) {
    var parts = String(dateString || '').split('-');
    if (parts.length !== 3) {
      return String(dateString || '');
    }
    return Number(parts[0]) + '年' + Number(parts[1]) + '月' +
      Number(parts[2]) + '日';
  }

  function renderSettings(settings) {
    state.settings = settings || null;
    var available = Boolean(
      settings &&
      settings.values &&
      typeof settings.revision === 'number'
    );
    setSettingsEnabled(available && !state.savingSettings);
    elements.onboardingCallout.classList.toggle(
      'hidden',
      !available || !settings.onboardingRequired
    );

    if (!available) {
      elements.settingsRuntime.textContent =
        '設定を読み込めません。アプリのセットアップ状態を確認してください。';
      elements.settingsResult.textContent = '';
      return;
    }

    elements.partnerNameInput.value = settings.values.partnerName || '';
    elements.userAddressInput.value = settings.values.userAddress || '';
    elements.replyLengthInput.value = settings.values.replyLength || 'balanced';
    elements.proactiveFrequencyInput.value =
      settings.values.proactiveFrequency || 'normal';
    elements.quietStartInput.value = settings.values.quietStart || '23:00';
    elements.quietEndInput.value = settings.values.quietEnd || '08:00';

    var runtime = settings.runtime || {};
    if (!settings.configurationValid) {
      elements.settingsRuntime.textContent =
        '保存済み設定に不整合があります。内容を確認して保存し直してください。';
    } else if (runtime.ready) {
      elements.settingsRuntime.textContent =
        '会話設定は有効です。変更は次の生成から反映されます。';
    } else {
      elements.settingsRuntime.textContent =
        '設定は保存できますが、現在は準備モードです。本番有効化は管理手順で行います。';
    }
  }

  function onSettingsSubmit(event) {
    event.preventDefault();
    if (
      state.savingSettings ||
      !state.settings ||
      typeof state.settings.revision !== 'number'
    ) {
      return;
    }

    var request = {
      expectedRevision: state.settings.revision,
      partnerName: elements.partnerNameInput.value,
      userAddress: elements.userAddressInput.value,
      replyLength: elements.replyLengthInput.value,
      proactiveFrequency: elements.proactiveFrequencyInput.value,
      quietStart: elements.quietStartInput.value,
      quietEnd: elements.quietEndInput.value
    };

    state.savingSettings = true;
    setSettingsEnabled(false);
    elements.settingsResult.removeAttribute('data-state');
    elements.settingsResult.textContent = '保存しています…';

    callServer('saveCharacterSettings', [request])
      .then(function(response) {
        if (!response || !response.ok || !response.settings) {
          var message = response && response.error && response.error.message
            ? response.error.message
            : '設定を保存できませんでした。';
          throw new Error(message);
        }
        state.settings = response.settings;
        renderSettings(state.settings);
        if (state.settings.runtime && state.settings.runtime.ready) {
          renderSystem({
            status: state.system.status,
            partnerName: state.settings.values.partnerName,
            userName: state.settings.values.userAddress,
            lastUpdatedAt: state.system.lastUpdatedAt,
            warnings: state.system.warnings
          });
        }
        elements.settingsResult.setAttribute('data-state', 'saved');
        elements.settingsResult.textContent = '設定を保存しました。';
      })
      .catch(function(error) {
        elements.settingsResult.setAttribute('data-state', 'error');
        elements.settingsResult.textContent =
          error.message || '設定を保存できませんでした。';
      })
      .finally(function() {
        state.savingSettings = false;
        setSettingsEnabled(Boolean(state.settings && state.settings.values));
      });
  }

  function setSettingsEnabled(enabled) {
    [
      elements.partnerNameInput,
      elements.userAddressInput,
      elements.replyLengthInput,
      elements.proactiveFrequencyInput,
      elements.quietStartInput,
      elements.quietEndInput,
      elements.settingsSaveButton
    ].forEach(function(element) {
      element.disabled = !enabled;
    });
  }

  function togglePanel(panel, button, open) {
    panel.classList.toggle('hidden', !open);
    button.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function renderMessages(scrollMode) {
    var previousHeight = elements.messages.scrollHeight;
    var previousTop = elements.messages.scrollTop;
    var wasNearBottom =
      previousHeight -
        previousTop -
        elements.messages.clientHeight <=
      80;

    while (elements.messages.firstChild) {
      elements.messages.removeChild(elements.messages.firstChild);
    }

    if (state.messages.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'message-row';

      var emptyBubble = document.createElement('div');
      emptyBubble.className = 'bubble';

      var emptyText = document.createElement('p');
      emptyText.className = 'bubble-text';
      emptyText.textContent = 'まだメッセージはありません。短いメッセージや画像から始められます。';

      emptyBubble.appendChild(emptyText);
      empty.appendChild(emptyBubble);
      elements.messages.appendChild(empty);
      return;
    }

    state.messages.forEach(function(message) {
      elements.messages.appendChild(createMessageNode(message));
    });

    if (scrollMode === 'preserve') {
      elements.messages.scrollTop =
        elements.messages.scrollHeight -
        previousHeight +
        previousTop;
      return;
    }

    if (scrollMode === 'new') {
      elements.messages.scrollTop = wasNearBottom
        ? elements.messages.scrollHeight
        : previousTop;
      return;
    }

    elements.messages.scrollTop = elements.messages.scrollHeight;
  }

  function createMessageNode(message) {
    var row = document.createElement('article');
    row.className = 'message-row';
    row.setAttribute(
      'data-role',
      message.messageType === 'proactive'
        ? 'assistant'
        : (message.role || 'system')
    );

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    var meta = document.createElement('div');
    meta.className = 'bubble-meta';

    var author = document.createElement('span');
    author.textContent = formatRoleLabel(message.role, message.messageType);

    var timestamp = document.createElement('time');
    timestamp.dateTime = message.createdAt || '';
    timestamp.textContent = formatTimestamp(message.createdAt);

    meta.appendChild(author);
    meta.appendChild(timestamp);
    bubble.appendChild(meta);

    var text = document.createElement('p');
    text.className = 'bubble-text';
    text.textContent = message.text || '';
    bubble.appendChild(text);

    if (message.image) {
      var imageMeta = document.createElement('div');
      imageMeta.className = 'bubble-image-meta';
      imageMeta.textContent = 'Image: ' + message.image.name + ' (' + message.image.mimeType + ')';
      bubble.appendChild(imageMeta);
    }

    row.appendChild(bubble);
    return row;
  }

  function setStatus(stateName, label, text) {
    elements.statusPanel.setAttribute('data-state', stateName);
    elements.statusLabel.textContent = label;
    elements.statusText.textContent = text;
  }

  function setBusyState(isBusy) {
    elements.sendButton.disabled = isBusy;
    elements.messageInput.disabled = isBusy;
    elements.imageInput.disabled = isBusy;
  }

  function setComposerEnabled(isEnabled) {
    elements.messageInput.disabled = !isEnabled || state.sending;
    elements.imageInput.disabled = !isEnabled || state.sending;
    elements.sendButton.disabled = !isEnabled || state.sending;
    elements.helperText.textContent = isEnabled
      ? 'メッセージ本文は安全にエスケープして表示されます。'
      : '送信するにはセットアップを完了してください。';
  }

  function updatePaginationUi() {
    elements.loadOlderButton.disabled = !state.pagination.hasMore || state.loadingOlder;
    elements.loadOlderButton.textContent = state.loadingOlder ? 'Loading...' : 'Load older messages';
  }

  function renderAttachmentMeta() {
    var maxBytes = bootstrap.imageMaxBytes || 4194304;
    elements.attachmentMeta.textContent = 'JPEG, PNG, or WebP up to ' + formatBytes(maxBytes);
  }

  function autoResizeTextarea() {
    elements.messageInput.style.height = 'auto';
    elements.messageInput.style.height = Math.min(elements.messageInput.scrollHeight, 180) + 'px';
  }

  function compareMessagesChronologically(left, right) {
    var timeDifference =
      new Date(left.createdAt).getTime() -
      new Date(right.createdAt).getTime();
    if (timeDifference !== 0) {
      return timeDifference;
    }
    if (
      left.requestId &&
      left.requestId === right.requestId &&
      left.role !== right.role
    ) {
      if (left.role === 'user') {
        return -1;
      }
      if (right.role === 'user') {
        return 1;
      }
    }
    return 0;
  }

  function upsertMessage(message) {
    if (!message || !message.messageId) {
      return false;
    }

    var found = false;
    var changed = false;

    state.messages = state.messages.map(function(existing) {
      if (existing.messageId === message.messageId) {
        found = true;
        changed =
          JSON.stringify(existing) !== JSON.stringify(message);
        return message;
      }

      return existing;
    });

    if (!found) {
      state.messages.push(message);
      changed = true;
    }

    if (changed) {
      state.messages.sort(compareMessagesChronologically);
    }

    return changed;
  }

  function callServer(functionName, args) {
    args = args || [];

    return new Promise(function(resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('google.script.run is unavailable in this context.'));
        return;
      }

      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function(error) {
          reject(new Error(error && error.message ? error.message : String(error)));
        });

      runner[functionName].apply(runner, args);
    });
  }

  function readFileAsDataUrl(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();

      reader.onload = function() {
        resolve(String(reader.result || ''));
      };

      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function generateRequestId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }

    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(character) {
      var random = Math.random() * 16 | 0;
      var value = character === 'x' ? random : (random & 0x3 | 0x8);
      return value.toString(16);
    });
  }

  function formatTimestamp(isoString) {
    if (!isoString) {
      return '';
    }

    try {
      var date = new Date(isoString);

      return date.toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    } catch (error) {
      return isoString;
    }
  }

  function toOffsetIsoString(date) {
    var timezoneOffsetMinutes = -date.getTimezoneOffset();
    var sign = timezoneOffsetMinutes >= 0 ? '+' : '-';
    var absoluteOffset = Math.abs(timezoneOffsetMinutes);
    var offsetHours = padNumber(Math.floor(absoluteOffset / 60));
    var offsetMinutes = padNumber(absoluteOffset % 60);

    return date.getFullYear() +
      '-' + padNumber(date.getMonth() + 1) +
      '-' + padNumber(date.getDate()) +
      'T' + padNumber(date.getHours()) +
      ':' + padNumber(date.getMinutes()) +
      ':' + padNumber(date.getSeconds()) +
      sign + offsetHours + ':' + offsetMinutes;
  }

  function padNumber(value) {
    return value < 10 ? '0' + value : String(value);
  }

  function normalizeSystemConfig(system) {
    system = system || {};

    return {
      userName: system.userName ? String(system.userName) : DEFAULT_LABELS.userName,
      partnerName: system.partnerName ? String(system.partnerName) : DEFAULT_LABELS.partnerName
    };
  }

  function formatRoleLabel(role, messageType) {
    if (role === 'user') {
      return state.system.userName;
    }

    if (
      role === 'assistant' ||
      messageType === 'proactive'
    ) {
      return state.system.partnerName;
    }

    return 'System';
  }

  function formatBytes(bytes) {
    if (!bytes) {
      return '0 B';
    }

    var units = ['B', 'KB', 'MB', 'GB'];
    var size = bytes;
    var unitIndex = 0;

    while (size >= 1024 && unitIndex < units.length - 1) {
      size = size / 1024;
      unitIndex += 1;
    }

    return size.toFixed(unitIndex === 0 ? 0 : 1) + ' ' + units[unitIndex];
  }

  function joinWarnings(warnings, fallback) {
    if (!warnings || !warnings.length) {
      return fallback;
    }

    return warnings.join('\n');
  }

  function isRetryableFailure(error) {
    return Boolean(error && error.code && RETRYABLE_CODES[error.code]);
  }
})();
</script>
